<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    
<head>    
<body>
    <center>
    <button onmousemove="red()">RED</button>
    <button onmousemove="blue()">BLUE</button>
    <button onmousemove="yellow()">YELLOW</button>
    <button onmousemove="pink()">PINK</button>
    </center>
</body>
<script>
    function red(){
        const red=document.body
        red.style.backgroundColor ='red'
    }
       function blue(){
        const blue=document.body
        blue.style.backgroundColor ='blue'
    } 
       function yellow(){
        const yellow=document.body
        yellow.style.backgroundColor ='yellow'
    }

        function pink(){
        const pink=document.body
        pink.style.backgroundColor ='pink'
        }    
</script>
</html>
